<div class="flex flex-col justify-center">
    <div class="flex flex-col justify-center items-center p-1">
        @if (currentImage()) {
            <div class="image border border-dark border-1 rounded">
                <img
                    [src]="currentImage()!.image"    
                    [title]="currentImage()!.title"    
                    [alt]="currentImage()!.title"  
                    loading="eager"    
                    priority      
                 />
            </div>
        }
    </div>
    <div class="flex justify-center items-center p-1 mt-2">
        <button
        type="button"
        class="btn btn-info me-1"
        title="Previous"
        (click)="previousOrNext(false)"
        >
        <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="size-6"
        >
            <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M15.75 19.5 8.25 12l7.5-7.5"
            />
        </svg>
        </button>
        @if (slideShowRunning()) {
        <button
            type="button"
            class="btn btn-error text-white me-1"
            title="Pause"
            (click)="pauseOrPlay()"
        >
            <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="size-6"
            >
            <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M15.75 5.25v13.5m-7.5-13.5v13.5"
            />
            </svg>
        </button>
        }
        @if (!slideShowRunning()) {
        <button
            type="button"
            class="btn btn-success me-1"
            title="Play"
            (click)="pauseOrPlay()"
        >
            <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="size-6"
            >
            <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M5.25 5.653c0-.856.917-1.398 1.667-.986l11.54 6.347a1.125 1.125 0 0 1 0 1.972l-11.54 6.347a1.125 1.125 0 0 1-1.667-.986V5.653Z"
            />
            </svg>
        </button>
        }
        <button
        type="button"
        class="btn btn-info"
        title="next"
        (click)="previousOrNext(true)"
        >
        <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="size-6"
        >
            <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="m8.25 4.5 7.5 7.5-7.5 7.5"
            />
        </svg>
        </button>
    </div>
</div>
